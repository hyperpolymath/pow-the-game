[package]
name = "fragmenter"
version = "0.1.0"
edition = "2021"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
description = "Decomposes combinatorial problems into independently solvable fragments for POW distributed compute"
license = "AGPL-3.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"

[dev-dependencies]
proptest = "1"
